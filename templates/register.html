<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NexusAI — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="auth-body">

<div class="auth-bg">
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div class="auth-container">
  <div class="auth-card glass">
    <div class="auth-logo">
      <span class="logo-hex">⬡</span>
      <h1>Nexus<em>AI</em></h1>
      <p class="auth-tagline">Create your account</p>
    </div>

    {% if error %}
    <div class="alert alert-error">
      <i class="fas fa-triangle-exclamation"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
      <div class="field-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fas fa-user input-icon"></i>
          <input type="text" name="username" placeholder="Choose a username" required/>
        </div>
      </div>
      <div class="field-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" name="password" placeholder="Choose a password" required/>
        </div>
      </div>
      <button type="submit" class="btn-primary full">
        <span>Create Account</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
